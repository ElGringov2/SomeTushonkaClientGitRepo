## Settings file was created by plugin Bot Census v1.5.0
## Plugin GUID: com.sipto.botcensus

[1. General]

## Toggle the on-screen bot census on or off.
# Setting type: Boolean
# Default value: true
Enable = true

## Hide the overlay in the menu and hideout; only draw it once you're in a raid.
# Setting type: Boolean
# Default value: true
Only In Raid = true

## Show or hide the census from the keyboard mid-raid. Drives the same switch as Enable, so the checkbox above follows along.
# Setting type: KeyboardShortcut
# Default value: 
Toggle Key = 

[2. Display]

## Overall size of the panel. Text, glyphs, row height and width all scale from this, so raise it on a large or high-resolution display.
# Setting type: Int32
# Default value: 16
# Acceptable value range: From 10 to 64
Font Size = 10

## Distance from the right edge of the screen.
# Setting type: Int32
# Default value: 20
Offset Right = 20

## Distance from the top edge of the screen.
# Setting type: Int32
# Default value: 40
Offset Top = 120

## Render with the game's Bender font (falls back to a DIN-like face, then Unity default).
# Setting type: Boolean
# Default value: true
Use Tarkov Font = true

## Panel backing opacity. 0 is fully see-through, 1 is solid.
# Setting type: Single
# Default value: 0.72
# Acceptable value range: From 0 to 1
Background Opacity = 0.72

## Draw a glyph beside each row. Off narrows the panel to text only.
# Setting type: Boolean
# Default value: true
Show Icons = false

## Glyph size relative to the text. 1 keeps them level with the font; raise it if the icons read small next to the numbers. Capped at the row height so a glyph can never spill into the row above or below.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0,6 to 1,5
Icon Scale = 1

[3. Rows]

## On: separate Raider and Rogue rows. Off: one 'Raider / Rogue' row to save space.
# Setting type: Boolean
# Default value: true
Split Rogue And Raider = true

## On: separate Boss and Guard rows so you can tell if only the guards are left. Off: one 'Boss / Guard' row.
# Setting type: Boolean
# Default value: true
Split Boss And Guard = true

