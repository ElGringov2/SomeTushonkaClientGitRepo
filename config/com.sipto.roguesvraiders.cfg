## Settings file was created by plugin Rogues V Raiders v1.7.0
## Plugin GUID: com.sipto.roguesvraiders

[1. General]

## Master switch. Off = no warband squads spawn.
# Setting type: Boolean
# Default value: true
Enable = true

## Allow roaming Rogue squads.
# Setting type: Boolean
# Default value: true
Rogue Squads = true

## Allow roaming Raider squads.
# Setting type: Boolean
# Default value: true
Raider Squads = true

[2. Behavior]

## How warband squads treat players. Faction authentic: rogues warn USEC first, raiders shoot.
# Setting type: Friendliness
# Default value: FactionAuthentic
# Acceptable values: FactionAuthentic, FriendlyToPlayers, HostileToAll
Friendliness = FactionAuthentic

## Warband squads roam and patrol as a group. Off = Phase-1 behavior (SAIN + vanilla patrol only). A mid-raid enable engages from the next raid.
# Setting type: Boolean
# Default value: true
Roaming Objectives = true

## BigBrain priority for the roam layer. 0 = auto (just below SAIN combat). Advanced.
# Setting type: Int32
# Default value: 0
# Acceptable value range: From 0 to 19
Objective Layer Priority = 0

## Roaming squads claim and hold a point of interest after patrolling it. Off = patrol only (2a behavior).
# Setting type: Boolean
# Default value: true
Lockdown POIs = true

## Seconds a squad patrols its ring before claiming it and posting up.
# Setting type: Int32
# Default value: 90
# Acceptable value range: From 0 to 600
Lockdown Delay (s) = 90

## Warband squads fight the AI ecosystem - the opposite faction, scavs, cultists, bosses, custom factions, and AI PMCs - but never their own faction, and rogues stay friendly with the Goons (raiders fight them). Off = squads stay neutral to other AI. The human-player relationship is set separately by Friendliness.
# Setting type: Boolean
# Default value: true
Broad AI Hostility = true

## After a squad locks down a POI, an available opposite-faction squad is sent to hunt it; if the hunters wipe the holders themselves they inherit the POI and hold it. Off = squads lock down and hold, no hunts.
# Setting type: Boolean
# Default value: true
Hunt and Takeover = true

[3. Spawning]

## Squads only take spawn points at least this far from every player, measured when they actually spawn. A squad with a named zone is also held back while that zone is closer than this to anyone, so most spawns land well past the floor; a zone that never opens up fields its squad at the farthest points it has after five minutes. 0 turns the check off. On a co-op server only the host's setting counts.
# Setting type: Int32
# Default value: 200
# Acceptable value range: From 0 to 500
Min Distance From Players (m) = 200

## Squads wait while more bots than this are alive. Ignored when Force Spawn Over Bot Cap is on.
# Setting type: Int32
# Default value: 22
# Acceptable value range: From 10 to 40
Alive Bot Ceiling = 22

## Spawn warband squads even when the map is already at the bot ceiling. The squads never take vanilla spawn slots, so this pushes the live bot count higher for a heavier fight at some performance cost.
# Setting type: Boolean
# Default value: false
Force Spawn Over Bot Cap = false

## Spawn chance scales with the raid's average level: 10% at level 15, +5% every 5 levels, capped at 25%. Off = use the per-faction chances from the server config.
# Setting type: Boolean
# Default value: true
Scale Chance By Level = true

[4. Debug]

## Log scheduling and squad registration detail.
# Setting type: Boolean
# Default value: false
Verbose Logs = false

