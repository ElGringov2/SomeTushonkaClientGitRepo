## Settings file was created by plugin Arma Zoom v1.0.0
## Plugin GUID: com.zolispt.armazoom

[1. General]

## Hold the right mouse button to zoom. Click it to aim.
# Setting type: Boolean
# Default value: true
Enabled = true

## Which button to hold. Whatever this is, holding it zooms and does not aim.
# Setting type: KeyboardShortcut
# Default value: Mouse1
Zoom button = Mouse1

## Seconds. Under this the press counts as a click and aims; over it, it zooms and does not aim.
# Setting type: Single
# Default value: 0.18
# Acceptable value range: From 0.05 to 1
Hold before zooming = 0.18

## On, a quick click toggles aim the way it always did. Off, the button only ever zooms.
# Setting type: Boolean
# Default value: true
Click still aims = true

## Left Alt and Left Control change the zoom level on a variable optic and cycle sights, both alongside the right mouse button. With this on the button is the game's while either is held, so those bindings no longer drop you out of your sights.
# Setting type: Boolean
# Default value: true
Leave the button alone with Alt or Ctrl held = true

[2. Zoom]

## Applied to whatever field of view the game is currently using, so it respects your FOV setting rather than fighting it. 0.6 is a little under two times magnification. Lower zooms further.
# Setting type: Single
# Default value: 0.6
# Acceptable value range: From 0.2 to 1
Field of view multiplier = 0.6

## Seconds to ease in and out. Zero snaps.
# Setting type: Single
# Default value: 0.12
# Acceptable value range: From 0 to 1
Transition time = 0.12

[3. Diagnostics]

## Writes one line per press to the BepInEx log: how long it was held, whether aiming was blocked, and the field of view before and after. Turn this on if the zoom is not behaving, the line tells you which half is at fault instead of guessing.
# Setting type: Boolean
# Default value: false
Log what each press did = true

